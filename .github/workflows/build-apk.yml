# Builds the Android app (APK) in the cloud, so you don't need to install Android Studio.
# How: put this project on GitHub, then Actions -> "Build Android APK" -> Run workflow.
# When it finishes, download "BottleDesk-apk" from the bottom of that run's page.
# Configure VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY under Settings -> Secrets and variables -> Actions -> Variables.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install

      - name: Check the money calculations and server
        run: npm test

      - name: Build the web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Add Android project
        run: npx cap add android

      - name: App icon (ok if this step fails)
        run: npx --yes @capacitor/assets generate --android
        continue-on-error: true

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BottleDesk-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
